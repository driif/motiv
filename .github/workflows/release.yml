# Publishes via npm trusted publishing (OIDC) configured for this repo and workflow.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Cloudflare Workers Builds deploys the `site` branch, which moves only when a release publishes.
      # changesets v3 output no longer sets `published`, so the release tag at HEAD is the signal.
      - run: if git tag --points-at HEAD | grep -q .; then git push origin HEAD:refs/heads/site; fi
